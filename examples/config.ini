# API Configuration Example
# API 配置示例
# 
# This file demonstrates how to configure API keys and endpoints
# 此文件演示如何配置 API 密钥和端点
#
# IMPORTANT: Never commit actual API keys to version control
# 重要：切勿将实际 API 密钥提交到版本控制

[Azure OpenAI]
provider_name = Azure OpenAI
api_endpoint = https://api.azure.com/openai
api_key_path = Y/API Keys/azure_key.txt
enabled = true

[Google Gemini]
provider_name = Google Gemini
api_endpoint = https://generativelanguage.googleapis.com
api_key_path = Y/API Keys/gemini_key.txt
enabled = true

[Apple AI Services]
provider_name = Apple AI Services
api_endpoint = https://api.apple.com/ai
api_key_path = Y/API Keys/apple_key.txt
enabled = true

[My Google AI]
provider_name = My Google AI
api_endpoint = https://ai.google.dev
api_key_path = Y/API Keys/google_ai_key.txt
enabled = true

# Model Deployment Configurations
# 模型部署配置

[Model: Gemini]
model_name = gemini_model
source_path = Y/data/models/gemini
export_path = Y/data/exports/gemini.tflite
format = tflite

[Model: Azure]
model_name = azure_model
source_path = Y/data/models/azure
export_path = Y/data/exports/azure.onnx
format = onnx

[Model: Apple]
model_name = apple_model
source_path = Y/data/models/apple
export_path = Y/data/exports/apple.mlmodel
format = coreml

# Deployment Settings
# 部署设置

[Deployment]
single_path = Y/data
api_keys_path = Y/API Keys
output_package = Y/data/packages/terraform_azure_gemini_apple_mygoogleai_mygemini_myiphone.zip

# Security Settings
# 安全设置

[Security]
# Enable Zero-Trust security model
# 启用零信任安全模型
zero_trust = true

# Require biometric authentication
# 需要生物识别认证
biometric_auth = true

# API request signing
# API 请求签名
request_signing = true

# Performance Settings
# 性能设置

[Performance]
# Number of threads for inference
# 推理线程数
num_threads = 4

# Enable model optimization
# 启用模型优化
enable_optimization = true

# Optimization level (0=none, 1=basic, 2=advanced)
# 优化级别（0=无，1=基本，2=高级）
optimization_level = 2
