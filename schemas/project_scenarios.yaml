      - "Euclidean distance: d = sqrt((x2-x1)^2 + (y2-y1)^2)"
      - "Dot product: a·b = |a||b|cos(θ)"
      - "Shannon entropy: H = -Σp·log2(p)"
      - "Exponential attenuation: I = I0·e^(-μxρ)"
