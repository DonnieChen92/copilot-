    description_tw: "轉錄會議、提取行動項目、生成報告"
    description_cn: "转录会议、提取行动项目、生成报告"
    platforms: ["OpenAI", "Google AI", "Microsoft AI"]
    components: ["python-pptx", "openpyxl", "python-docx", "spaCy"]
    memory_type: ["episodic", "entity", "summary"]
    outputs:
