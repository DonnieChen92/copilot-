  # =========================================================================
  # Scenario 14: AI Global Centrality / AI 全球中心化 / AI 全球中心化
  # =========================================================================
  - id: "S014"
    name_en: "AI Global Centrality Quality Safety Gateway"
    name_tw: "AI 全球中心化品質安全閘道"
    name_cn: "AI 全球中心化质量安全网关"
    description_en: "Unified four-ecosystem framework with centralized quality/safety gateway and distributed operational control"
    description_tw: "統一四大生態系統框架，集中式品質/安全閘道與分佈式運營控制"
    description_cn: "统一四大生态系统框架，集中式质量/安全网关与分布式运营控制"
    platforms: ["Apple Intelligence", "Microsoft Intelligence", "Google Intelligence", "Tencent Intelligence"]
    components: ["base_client.py", "deploy_orchestrator.py", "memory_manager.py", "nlu_pipeline.py"]
    architecture:
      geometric_evolution:
        - stage: "Point"
          meaning: "Single AI instance — one user, one model"
        - stage: "Line"
          meaning: "Connection — user-AI bidirectional flow"
        - stage: "Circle"
          meaning: "Ecosystem — multi-model feedback cycle"
        - stage: "Triangle"
          meaning: "Stability — Quality + Safety + Distribution pillars"
        - stage: "Square Sandbox"
          meaning: "Complete framework — four ecosystems bounded"
        - stage: "Tetrahedron (3D)"
          meaning: "Multi-dimensional control — depth of integration"
    four_pillars:
      apple_intelligence:
        focus: "Privacy-first on-device processing"
        key_tech: ["Apple Silicon", "Core ML", "Siri/SI", "iOS/macOS"]
      microsoft_intelligence:
        focus: "Enterprise productivity + OpenAI partnership"
        key_tech: ["Azure AI", "Copilot", "Office 365", "GitHub"]
      google_intelligence:
        focus: "Research-first, open-model approach"
        key_tech: ["Gemini", "TensorFlow", "Android AI", "Cloud TPU"]
      tencent_intelligence:
        focus: "Social-first, China market integration"
        key_tech: ["Hunyuan", "WeChat AI", "QQ/Weixin", "Cloud AI"]
    gateway_layers:
      - "Input Quality Gate — prompt validation, language detection, intent classification"
      - "Routing & Distribution — optimal model selection, geographic routing, load balancing"
      - "Processing — four ecosystem parallel execution"
      - "Output Safety Gate — hallucination detection, PII redaction, bias checks"
      - "Audit & Administration — full logging, cost tracking, compliance reporting"
