# --- Life Challenge Programme ---
life_challenge:
  stages:
    finance:
      access: "full_plus_support"
      description: "Active but under financial stress"
      support: ["financial_aid", "scholarship", "fee_deferral", "centrelink_guide", "mental_health"]
    pause:
      access: "limited_ai_read_only"
      description: "Study leave (up to 6 months)"
      max_duration_months: 6
      support: ["mental_health", "financial_aid", "centrelink_guide"]
    restart:
      access: "full_plus_catch_up"
      description: "Returning to study"
      support: ["ai_catch_up", "peer_mentoring", "academic_advisor", "career_guidance"]
    complete:
      access: "alumni_lifetime"
      description: "Graduated"
      support: ["career_guidance", "alumni_network"]

  milestone:
    date: "2026-02-12"
    location: "Melbourne, Australia"
    description: "Target milestone for Life Challenge Programme pilot cohort"
