# --- MRI Property Tree Data Model ---
property_management:
  property_types:
    residential:
      - student_housing
      - staff_residences
      - visitor_accommodation
    commercial:
      - retail_tenancies
      - office_leases
      - lab_research_space
      - event_venues
      - food_and_beverage

  lease_statuses:
    - draft
    - pending_approval
    - active
    - renewal_due
    - expired
    - terminated

  maintenance_statuses:
    - open
    - assigned
    - in_progress
    - awaiting_parts
    - completed
    - closed

  agents:
    lendlease:
      scope: "facility_management"
      description: "Campus facility management, maintenance, and operations"
    jll:
      scope: "valuation_and_leasing"
      description: "Property valuation, commercial leasing, and tenant management"
    micm:
      scope: "residential_management"
      description: "Residential property management, student/staff housing"

# --- Anti-Hallucination Verification Pipeline ---
anti_hallucination:
  pipeline_stages:
    1_multi_model_query:
      description: "Query sent to 3+ frontier models simultaneously"
      models: ["gpt-4o", "claude-sonnet-4-5-20250929", "gemini-2.0-pro"]
    2_cross_verification:
      description: "Compare responses; identify consensus and divergence"
      method: "embedding_semantic_similarity"
    3_source_citation:
      description: "Every claim must cite evidence"
      source_types:
        - academic_paper
        - legislation
        - elibrary_resource
        - official_documentation
        - court_case
        - textbook
    4_confidence_scoring:
      description: "Composite score 0.0 → 1.0"
      thresholds:
        high_confidence: 0.8
        partial_verification: 0.6
        rejection: 0.2
    5_manual_verification:
      description: "Human-in-the-loop for flagged responses"
      triggers:
        - "confidence < 0.6"
        - "legal/legislation query"
        - "medical/clinical query"
        - "financial advice query"
      verification_sources:
        - "AustLII (www.austlii.edu.au)"
        - "UniMelb e-library"
        - "PubMed"
        - "IEEE Xplore"
    6_audit_log:
      description: "Immutable Azure Monitor log"
      fields:
        - timestamp
        - user_id
        - models_used
        - confidence_score
        - sources_cited
        - verification_status
        - latency
        - token_usage
        - cost

