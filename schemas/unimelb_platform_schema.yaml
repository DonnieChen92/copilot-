# =============================================================================
# UniMelb AI Platform — Data Schema Definition
# =============================================================================
# Defines all data models, relationships, and deployment environments
# for the UniMelb AI Platform across all modules.
#
# Pilot Concept: Jiadong Chen (Student ID: 723912)
# Date: 12 February 2026, Melbourne, Australia
# =============================================================================

schema_version: "1.0.0-alpha"
platform: "UniMelb AI"

# --- Deployment Environments ---
environments:
  alpha_dev:
    description: "Development & unit testing"
    data_type: "synthetic"
    access: "developers_only"
    language_stack: "Python 3.12+ (FastAPI), TypeScript (React)"
    database: "SQLite"
    infrastructure: "Local Docker"
    mri_connection: "mock"

  beta_staging:
    description: "Integration testing & UAT"
    data_type: "anonymised_production_clone"
    access: "dev_qa_select_users"
    language_stack: "C# (.NET 8), TypeScript (Next.js), Python (ML)"
    database: "Azure SQL (staging)"
    infrastructure: "Azure AKS (staging)"
    mri_connection: "staging_api"

  test:
    description: "Daily automated regression"
    data_type: "synthetic_edge_cases"
    access: "ci_cd_pipeline"
    language_stack: "All"
    database: "Ephemeral (per test run)"
    infrastructure: "GitHub Actions"
    mri_connection: "mock"

  training:
    description: "Staff and agent training"
    data_type: "curated_training_dataset"
    access: "onboarding_users"
    language_stack: "All"
    database: "Training DB (Azure SQL)"
    infrastructure: "Azure AKS (training)"
    mri_connection: "sandbox"

  daily_use:
    description: "Standard daily operations"
    data_type: "live_production"
    access: "authorised_users_per_rbac"
    language_stack: "C#/.NET + C/C++ core"
    database: "Azure SQL"
    infrastructure: "Azure AKS (production)"
    mri_connection: "production_api"

  live_production:
    description: "Real-time production (primary)"
    data_type: "live_primary"
    access: "all_users_per_rbac"
    language_stack: "C#/.NET + C/C++ optimised core"
    database: "Azure SQL HA (multi-region)"
    infrastructure: "Azure AKS (multi-region AU + APAC)"
    mri_connection: "production_api_ha"

  backup:
    description: "Disaster recovery"
    data_type: "geo_redundant_replica"
    access: "dr_team_automated_failover"
    language_stack: "N/A"
    database: "Azure SQL Geo-replica"
    infrastructure: "Azure paired region"
    mri_connection: "readonly_replica"

