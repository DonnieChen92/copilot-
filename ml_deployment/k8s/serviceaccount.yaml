apiVersion: v1
kind: ServiceAccount
metadata:
  name: ml-service
  namespace: ml-deployment
  labels:
    app.kubernetes.io/name: ml-service
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ml-service-role
  namespace: ml-deployment
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ml-service-rolebinding
  namespace: ml-deployment
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ml-service-role
subjects:
  - kind: ServiceAccount
    name: ml-service
    namespace: ml-deployment
