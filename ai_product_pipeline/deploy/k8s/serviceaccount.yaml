apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-pipeline
  namespace: ai-pipeline
  labels:
    app.kubernetes.io/name: ai-pipeline
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-pipeline-role
  namespace: ai-pipeline
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-pipeline-rolebinding
  namespace: ai-pipeline
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-pipeline-role
subjects:
  - kind: ServiceAccount
    name: ai-pipeline
    namespace: ai-pipeline
