apiVersion: v1
kind: Service
metadata:
  name: ai-pipeline
  namespace: ai-pipeline
  labels:
    app.kubernetes.io/name: ai-pipeline
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: ai-pipeline
---
apiVersion: v1
kind: Service
metadata:
  name: ai-pipeline-headless
  namespace: ai-pipeline
  labels:
    app.kubernetes.io/name: ai-pipeline
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app.kubernetes.io/name: ai-pipeline
