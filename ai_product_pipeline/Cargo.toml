[package]
name = "ai_product_pipeline"
version = "0.1.0"
edition = "2021"
authors = ["Donnie Chen <donniechen92@gmail.com>"]
description = "AI-driven product pipeline with multi-model orchestration"
license = "MIT"
repository = "https://github.com/DonnieChen92/copilot-"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Web framework
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client for AI APIs
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Configuration
config = "0.14"
dotenvy = "0.15"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Metrics
prometheus = "0.13"

# UUID generation
uuid = { version = "1.6", features = ["v4", "serde"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio-test = "0.4"
criterion = "0.5"

[[bench]]
name = "pipeline_bench"
harness = false

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
