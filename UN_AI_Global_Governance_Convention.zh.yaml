un_ai_global_governance_convention:
  meta:
    id: "UN-AI-GOV-CONV"
    title_zh: "人工智能全球治理公约（个人建议草案）"
    version: "0.1.0-personal-draft"
    status: "draft"
    date: "2026-01-04"
    language: "zh-CN"
    scope: "global"
    drafting_note: |
      本文件为“联合国级AI治理公约”之个人建议草案，供多边对话、条约谈判与政策试点参考。
      目标：在尊重各国主权与文化多样性的前提下，确立国际和平与人类尊严底线，推动AI向善与共享发展。
    guiding_instruments:
      - "联合国宪章（宗旨与原则：和平、安全、主权平等、人权与尊严）"
      - "OECD《人工智能原则》（以人为本、稳健安全、透明问责等）"
      - "欧盟《人工智能法案》（风险分级与合规义务经验）"
      - "GPAI（多方参与与政策协作平台经验）"
      - "IEEE《Ethically Aligned Design》（合伦理设计与责任体系）"
      - "《巴黎协定》的协同治理范式（类比：全球问题需全球共识与行动）"

  preamble: |
    缔约方确认：人工智能之发展与应用正深刻影响人类社会、经济与安全格局。
    为防止技术失控、滥用与不平等扩大，缔约方决定在联合国指导下，
    以维护国际和平与安全、促进人类尊严与权利、尊重国家主权与文化多样性为核心，
    建立兼具可执行性、可审计性与可持续性的全球AI治理规则体系。

  glossary:
    - term: "人工智能系统"
      definition: "以数据、算法、模型与计算基础设施为核心，能在一定自主程度上生成预测、推荐、决策或内容输出的软硬件系统。"
    - term: "通用目的AI（GPAI）"
      definition: "可在多类任务与多场景复用，且具备跨领域迁移能力的AI模型或系统。"
    - term: "高风险AI系统"
      definition: "其错误、偏差或滥用可能显著影响生命健康、基本权利、公共安全、关键基础设施或重大公共利益的AI系统。"
    - term: "不可接受风险（禁止类）"
      definition: "其目的或效果本质上不可与人权、尊严、和平原则相容的AI用途，应被禁止。"
    - term: "算法透明"
      definition: "对AI系统的用途、能力边界、输入输出、关键决策因素、训练/评估概况提供可理解、可审查的信息披露。"
    - term: "可审计性"
      definition: "对AI系统的设计、数据、训练、评估、部署、更新与运行日志具备可追溯与可核验能力，便于独立审计。"
    - term: "可解释性"
      definition: "对特定输出或决策提供合理解释，使受影响者与监管方能够理解其主要依据与限制。"
    - term: "数据主权"
      definition: "国家依法对其境内产生、收集或处理的重要数据行使管辖与保护权，并保障个人数据权利。"
    - term: "人类有效控制（Human-in/On-the-Loop）"
      definition: "在高后果情境中，人类可理解、可介入、可否决AI关键决策，并承担最终责任。"

  principles:
    - id: "P1"
      name: "以人为本与人类尊严"
      norm: "AI应服务于人的福祉，尊重每个人的尊严、权利与自由，不得将人简化为可被算法任意支配的对象。"
    - id: "P2"
      name: "国际和平与安全优先"
      norm: "禁止推动AI军备竞赛；避免AI成为冲突升级工具；任何军事AI必须受国际人道法约束与人类有效控制。"
    - id: "P3"
      name: "主权平等与不干涉"
      norm: "尊重各国主权与治理选择，不以技术优势干涉他国内政；同时遵守国际底线，避免对他国造成重大外溢损害。"
    - id: "P4"
      name: "公平接入与反数字殖民"
      norm: "保障各国与各群体公平获得AI基础能力与收益；反对技术霸权、单边技术封锁与数字殖民。"
    - id: "P5"
      name: "透明、可解释与可审计"
      norm: "关键AI系统必须可理解、可追溯、可核验；对高风险系统实行登记、评估、审计与持续监测。"
    - id: "P6"
      name: "隐私保护与数据治理"
      norm: "保护个人数据权利与国家数据主权；鼓励隐私增强技术，规范跨境数据流动。"
    - id: "P7"
      name: "责任与救济"
      norm: "明确开发者、部署者、使用者的责任链；建立事故通报、问责与受害者救济机制。"
    - id: "P8"
      name: "包容与能力建设"
      norm: "促进全球南方参与；支持技术转移、教育培训与基础设施能力建设。"
    - id: "P9"
      name: "可持续发展与环境责任"
      norm: "鼓励AI用于实现可持续发展目标；评估并降低训练与部署的能源与环境足迹。"

  risk_taxonomy:
    levels:
      - key: "prohibited"
        label_zh: "不可接受风险（禁止类）"
        default_action: "禁止研发/部署/出口/进口与技术协助"
      - key: "high"
        label_zh: "高风险"
        default_action: "强制登记 + 事前合规评估 + 独立审计 + 持续监测 + 强化人类监督"
      - key: "limited"
        label_zh: "有限风险"
        default_action: "透明披露 + 用户告知 + 申诉与纠错机制"
      - key: "minimal"
        label_zh: "最低风险"
        default_action: "倡导性治理 + 基本安全与隐私基线"

  institution:
    name: "国际人工智能治理理事会（IAIGC）"
    under: "联合国指导/授权"
    mandate:
      - "全球AI规则与技术基线建议"
      - "高风险AI国际登记与通报协调"
      - "跨国重大AI事件调查与技术协作"
      - "能力建设与技术合作基金管理"
      - "年度透明度报告与风险展望"
    governance:
      representation: "普遍参与 + 区域平衡 + 全球南方保障席位"
      transparency: "公开议程、决议、统计与年度报告（涉密信息按程序保密）"
      multi_stakeholder: "政府 + 学术界 + 企业 + 技术社群 + 公民社会"

  chapters:
    - id: "C1"
      title: "总则"
      articles:
        - id: "A1"
          title: "宗旨与适用范围"
          objective:
            - "确立AI全球治理共同规则，维护和平、安全、人权与尊严。"
            - "促进公平接入、共享发展与可持续创新。"
          scope:
            applies_to:
              - "国家政策与监管"
              - "跨境AI系统提供与部署"
              - "高风险与通用目的AI开发/发布"
            exclusions:
              - "纯理论研究（不涉及部署/对外提供）可适度豁免，但须遵守安全与出口控制底线"
          obligations:
            states: ["将本公约原则纳入国内法与监管实践", "建立国家级AI主管机构与协调机制"]
            providers: ["遵守风险分级合规义务", "配合审计与事故通报"]
            users: ["在高后果场景保持人类监督与合规使用"]

        - id: "A2"
          title: "定义与解释规则"
          rules:
            - "术语以本公约glossary为准；未定义术语由IAIGC发布解释性指引。"
            - "当不同语言文本不一致时，以联合国保存的权威文本为准。"

        - id: "A3"
          title: "基本原则与红线"
          norms:
            - "任何AI活动不得以侵犯人权、奴役、歧视、压迫或战争侵略为目的。"
            - "对个人基本权利有重大影响的决策必须可申诉、可纠错、可救济。"
            - "国家行使主权治理权时须避免对他国造成重大外溢损害。"

    - id: "C2"
      title: "公平接入与国际合作"
      articles:
        - id: "A4"
          title: "全球AI使用权与平等接入"
          commitments:
            - "建立AI基础设施与公共能力的国际合作机制（算力、教育、开源工具、公共数据治理）。"
            - "推动在医疗、教育、减贫、防灾等领域的AI公益项目共享。"
          prohibitions:
            - "不得以垄断或胁迫方式强迫他国接受特定技术路线或治理模式。"
          cooperation_tools:
            - "能力建设基金"
            - "开放教育资源与课程互认"
            - "联合研发与公共产品"

        - id: "A5"
          title: "反技术霸权与反数字殖民"
          rules:
            - "反对利用技术封锁、单边出口限制、歧视性标准阻碍他国合理发展。"
            - "跨境平台不得以算法操纵或信息战手段干涉他国政治与社会秩序。"
          reporting:
            - "IAIGC每年发布‘全球AI公平指数与风险评估报告’（指标含接入、人才、算力、监管能力等）。"

    - id: "C3"
      title: "透明、审计与风险治理"
      articles:
        - id: "A6"
          title: "透明披露与可解释性"
          minimum_disclosures:
            - "系统用途与限制（Intended Use / Limitations）"
            - "训练数据类别概况与数据治理声明（不强制公开敏感数据本体）"
            - "模型评估摘要（安全、偏见、鲁棒性、对抗风险）"
            - "人类监督与纠错路径"
            - "版本与更新日志"
          user_rights:
            - "知情权：重要交互应明确告知‘AI参与’"
            - "解释权：高后果决定应提供可理解解释与可申诉入口"
          safeguards:
            - "商业秘密与国家安全信息可依程序保护，但不得以此规避合规审计。"

        - id: "A7"
          title: "高风险AI登记、事前评估与独立审计"
          triggers_high_risk_categories:
            - "关键基础设施与公共安全"
            - "教育与考试评估"
            - "就业与劳动管理"
            - "医疗诊断与生命健康"
            - "金融与基本公共服务（信贷、住房、救助）"
            - "执法、司法与移民管理"
          obligations:
            providers:
              - "高风险AI系统上线前提交合规评估（含数据治理、偏见评估、安全测试、红队测试摘要）"
              - "接受独立第三方审计（周期：至少每12个月或重大版本更新后）"
              - "建立运行日志与可追溯链（事件/输入输出/关键参数变更）"
            states:
              - "设立国家级高风险AI登记接口，与IAIGC登记系统互联互通"
              - "对跨境提供高风险AI实行许可与合规核验"
          audit_minimum_checklist:
            - "安全与鲁棒性"
            - "偏见与公平"
            - "隐私与数据合规"
            - "可解释与人类监督"
            - "滥用风险与防护（包括水印/溯源/访问控制等）"

    - id: "C4"
      title: "数据治理、隐私与主权"
      articles:
        - id: "A8"
          title: "个人数据权利与隐私保护"
          rights:
            - "知情与同意（或合法替代依据）"
            - "访问、更正、删除、限制处理"
            - "自动化决策反对权与人工复核权（高后果场景）"
          obligations:
            providers:
              - "最小必要原则、目的限定、存储期限限制"
              - "采用隐私增强技术（去标识化、差分隐私、联邦学习等）优先"
              - "重大数据泄露与模型反向推断风险必须通报并修复"

        - id: "A9"
          title: "数据主权与跨境数据流动"
          norms:
            - "尊重各国对重要数据的管辖权与本地化要求。"
            - "跨境数据流动须满足：合法性、必要性、等效保护、可审计性。"
          mechanism:
            - "建立‘跨境数据合规通道’：标准合同条款/认证/互认机制"
            - "对敏感领域可设置更高门槛（国防、关键基础设施、未成年人等）"

    - id: "C5"
      title: "和平、安全与禁止事项"
      articles:
        - id: "A10"
          title: "禁止用途（不可接受风险清单）"
          prohibited_use_cases:
            - "完全自主的致命性武器系统（无有效人类控制的致命攻击决策）"
            - "以压制基本权利为目的的大规模监控与群体迫害"
            - "社会信用评分式的国家级普遍性行为评级并施加惩罚（缺乏正当程序与救济）"
            - "面向公众的大规模欺诈、操纵性深度伪造用于破坏选举与公共秩序（无标识、无溯源）"
            - "以歧视为目的或效果显著的算法决策（种族、民族、宗教、性别等受保护特征）"
          duties:
            states: ["将禁止清单入法并设立刑事/行政处罚", "跨境协作打击相关犯罪"]
            providers: ["不得提供技术协助、模型权重或关键组件", "建立滥用监测与阻断机制"]

        - id: "A11"
          title: "军事AI限制与人类有效控制"
          rules:
            - "任何涉及致命武力或重大伤害风险的决策必须保有人类有效控制。"
            - "军事AI必须遵守国际人道法原则（区分、比例、必要、预防）。"
            - "设立军用AI伦理审查与可追溯记录制度。"
          confidence_building:
            - "信息透明措施：发布军用AI原则声明与风险管理概况"
            - "防误判热线与危机沟通机制"

    - id: "C6"
      title: "人权保障与社会治理"
      articles:
        - id: "A12"
          title: "人权影响评估与公众参与"
          requirements:
            - "公共部门部署高风险AI前应进行人权影响评估（HRIA）。"
            - "重大系统应进行公众咨询与可理解披露，保障弱势群体参与。"
          safeguards:
            - "设立申诉与救济通道"
            - "不得因使用AI而剥夺正当程序"

        - id: "A13"
          title: "公民基本权利保障（身份、表达、劳动、学习）"
          rights_bundle:
            identity:
              - "禁止冒用身份与深度伪造侵权；鼓励内容溯源与标识机制。"
            expression:
              - "不得以不透明算法实施任意审查；应披露内容分发与审核规则要点。"
            labor:
              - "反就业歧视；对算法招聘与绩效系统实行审计与可解释要求。"
              - "推动再培训与社会保障政策应对自动化冲击。"
            education:
              - "普及数字素养与AI基础教育；保护未成年人数据与权益。"

    - id: "C7"
      title: "问责、救济与争端解决"
      articles:
        - id: "A14"
          title: "伦理审查与合规治理体系"
          state_level:
            - "设立国家AI伦理委员会或同等机构"
            - "建立高风险AI许可/备案制度"
          provider_level:
            - "建立AI治理负责人制度（Accountable Executive）"
            - "发布模型卡/系统卡与风险管理计划"
            - "内部红队与安全评估常态化"

        - id: "A15"
          title: "事故通报、信息共享与应急响应"
          incident_definition: "导致死亡/重伤、重大权利侵害、重大公共安全风险、跨境重大影响的AI事件"
          timelines:
            initial_notice: "72h内向国家主管机构与IAIGC提交初报（如具备条件）"
            full_report: "30天内提交详报与整改计划"
          shared_database:
            - "IAIGC维护全球AI事件库（匿名化与分级披露）"
          emergency_actions:
            - "暂停/回滚高风险系统"
            - "快速修复与补丁发布"
            - "受影响人群通知与救济"

        - id: "A16"
          title: "责任链、追责与受害者救济"
          liability_chain:
            - "开发者责任：设计缺陷、训练与评估疏忽、已知风险未披露"
            - "部署者责任：不当用途、未设人类监督、违规场景部署"
            - "使用者责任：违法滥用、规避安全措施"
          remedies:
            - "纠错与人工复核"
            - "损害赔偿与集体救济"
            - "行政处罚与刑事追责（严重情形）"
          cross_border_cooperation:
            - "司法协助与证据互认"
            - "跨境执法协作打击AI诈骗与深度伪造犯罪"

        - id: "A17"
          title: "国际协调机构与合规互认"
          iaigc_powers:
            - "发布全球基线与技术指引"
            - "协调高风险登记互联"
            - "组织跨国审计合作与能力建设"
          mutual_recognition:
            - "在等效保护前提下推动审计与认证互认"
            - "保护发展中国家参与机会，避免认证壁垒成为新型贸易壁垒"

        - id: "A18"
          title: "全球南方参与、技术转移与能力建设"
          commitments:
            - "设立能力建设基金（基础设施、教育培训、公共项目）"
            - "促进自愿许可、联合研发、开源协作与人才交流"
            - "保障治理机构席位与议程设置参与权"

        - id: "A19"
          title: "争端解决"
          steps:
            - "友好协商"
            - "IAIGC调解/专家评估"
            - "仲裁或提交国际法院（如缔约方同意）"

        - id: "A20"
          title: "生效、修订与退出"
          entry_into_force:
            condition: "满足一定数量缔约方批准后生效（谈判确定）"
          amendment:
            - "可由任一缔约方提案，经大会审议表决通过"
          withdrawal:
            - "退出需提前通知，但不得免除退出前已产生的责任与救济义务"

  annexes:
    - id: "ANNEX-1"
      title: "高风险AI合规材料清单（最小集）"
      items:
        - "系统卡（用途/限制/用户群体/安全边界）"
        - "数据治理声明（来源类别/质量控制/隐私措施）"
        - "评估报告摘要（性能/公平/安全/鲁棒/对抗）"
        - "人类监督方案（介入点/否决权/培训）"
        - "事件响应计划（通报/回滚/修复）"
        - "审计报告与整改闭环"
    - id: "ANNEX-2"
      title: "禁止用途快速判定问卷（示例）"
      questions:
