name: SACA Office Intelligence CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 openpyxl python-pptx

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 saca/applications/office_intelligence/src --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings.
        flake8 saca/applications/office_intelligence/src --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Smoke Test - LLM Bridge
      run: python saca/applications/office_intelligence/src/llm_bridge.py

    - name: Smoke Test - Excel Memory
      run: python saca/applications/office_intelligence/src/excel_memory.py

    - name: Smoke Test - PPT Agent
      run: python saca/applications/office_intelligence/src/ppt_agent.py
