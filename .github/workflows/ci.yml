name: AI Platform CI/CD

on:
  push:
    branches: [ main, copilot/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Verify installation
      run: |
        python -c "import fastapi; import uvicorn; print('Dependencies installed successfully')"
    
    - name: Start server in background
      run: |
        uvicorn main:app --host 0.0.0.0 --port 8000 &
        SERVER_PID=$!
        echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
        sleep 5
    
    - name: Test health endpoint
      run: |
        curl -f http://localhost:8000/health || exit 1
    
    - name: Test flag ceremony endpoint
      run: |
        curl -f http://localhost:8000/ai/flag_ceremony || exit 1
    
    - name: Test API documentation
      run: |
        curl -f http://localhost:8000/docs || exit 1
    
    - name: Stop server
      run: |
        kill $SERVER_PID || true

  docker:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Build Docker image
      run: |
        docker build -t ai-autopilot-platform:latest .
    
    - name: Test Docker container
      run: |
        docker run -d -p 8000:8000 --name test-container ai-autopilot-platform:latest
        sleep 5
        curl -f http://localhost:8000/health || exit 1
        docker stop test-container
        docker rm test-container
